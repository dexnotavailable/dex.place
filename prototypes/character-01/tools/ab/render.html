<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const q=new URLSearchParams(location.search);
const src=q.get('src');
const files=['00-core.js','10-raster.js','25-shape.js','30-rig.js'];
window.onerror=(m,s,l)=>{document.title='ERR '+m+' @'+s+':'+l;};
(async()=>{
  for(const f of files){ await new Promise((res)=>{const s=document.createElement('script'); s.src=src+'/'+f; s.onload=res; s.onerror=res; document.body.appendChild(s);}); }
  await new Promise((res)=>{const s=document.createElement('script'); s.src='poses.js'; s.onload=res; document.body.appendChild(s);});
  const pose=q.get('pose')||'idle', cos=q.get('costume')||'split', mode=q.get('mode')||'full';
  if (typeof COSTUMES!=='undefined' && COSTUMES[cos]) COSTUME=COSTUMES[cos];
  const buf=new PixBuf(540,420); const hero=new Heroine(); hero.blinkT=1e9;
  const J=solveRig(POSES[pose], null);
  for(let i=0;i<300;i++){ hero.simulate(J, 0, 0, 1, 1/60, {wind:-14}); }
  buf.reset(); drawHeroine(buf,J,hero,270,330,0,0,1,{time:0}); buf.finish([], {mode});
  // crop to a fixed window around the root so versions line up
  const W=+(q.get('w')||170), H=+(q.get('h')||230), X=270-W/2+(+(q.get('x')||0)), Y=330-H+12;
  const c=document.getElementById('c'); c.width=W; c.height=H; const cx=c.getContext('2d');
  cx.drawImage(buf.canvas, X, Y, W, H, 0, 0, W, H);
  window.__png=c.toDataURL('image/png'); document.title='OK';
})();
</script></body></html>
