<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="robots" content="noindex" />
    <title>dex</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/Daniel-Regular.otf" as="font" type="font/otf" crossorigin />
    <style>
      /* Daniel, by Daniel Midgley; unmodified, notice at /fonts/Daniel-license.txt (CC BY-ND 3.0). */
      @font-face {
        font-family: "Daniel";
        src: url("/fonts/Daniel-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        background: #0c0c0d;
        color: #e6ece2;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        justify-items: center;
        align-content: center;
        padding:
          max(4rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(7rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
      }
      main { width: 100%; max-width: 28rem; }
      ::selection { background: #e6ece2; color: #0c0c0d; }
      .mark {
        margin: 0 0 2rem;
        padding-top: 0.28em;
        font-family: "Daniel", system-ui, sans-serif;
        font-size: 4rem;
        font-weight: 400;
        line-height: 1;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-width: 2.75rem;
        min-height: 2.75rem;
        color: inherit;
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-decoration-color: #60645f;
        text-underline-offset: 0.25em;
      }
      a:hover { text-decoration-color: currentColor; }
      a:focus-visible { outline: 2px solid #ff6b78; outline-offset: 2px; border-radius: 2px; }
      @media (max-width: 40rem) {
        body {
          padding-top: max(3rem, env(safe-area-inset-top));
          padding-bottom: max(6rem, env(safe-area-inset-bottom));
        }
        .mark { font-size: 2.875rem; margin-bottom: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="mark">dex</h1>
      <a href="/">home</a>
    </main>
  </body>
</html>
